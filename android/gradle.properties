org.gradle.jvmargs=-Xmx6G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=false

# Configurações para evitar timeout no CI/CD
systemProp.http.connectionTimeout=180000
systemProp.http.socketTimeout=180000
systemProp.https.connectionTimeout=180000
systemProp.https.socketTimeout=180000

# Retry automático para downloads
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true

# Allow Kotlin/Java JVM target mismatch in plugins like tflite_flutter
# that still declare Java 11 while the rest of the build is on 17.
# Kotlin would otherwise fail the build with
# "Inconsistent JVM-target compatibility detected".
kotlin.jvm.target.validation.mode=warning
