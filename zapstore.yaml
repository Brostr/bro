name: Bro
description: |
    Bro is an open peer-to-peer application protocol that lets anyone pay bills
    using Bitcoin over the Lightning Network. Initially available for PIX and
    Boleto in Brazil; CoDi in Mexico; PromptPay in Thailand; Transferencia 3.0
    in Argentina; Bre-B in Colombia.

    All communication is end-to-end encrypted (NIP-44) and travels through
    decentralized Nostr relays — no central server, no accounts, no KYC.

    Features:
    - Self-custodial Lightning wallet (Breez Spark SDK)
    - Multi-currency P2P marketplace
    - BRIX Lightning Address (receive Bitcoin via phone or email)
    - QR code scanner
    - Real-time order tracking
    - Collateral tiers and AI-assisted dispute resolution
    - Login with Nostr key (nsec) or BIP-39 seed
summary: Pay bills with Bitcoin. No banks. No KYC.
license: MIT
tags: [bitcoin, lightning, nostr, payments, p2p]
# Pick the arm64-v8a split APK (~135MB) from the GitHub release assets.
match: '.*arm64-v8a.*\.apk$'
